<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aero Mix Bridge</title>
  <style>
    :root{color-scheme:dark}
    body{margin:0;width:280px;background:#0f1217;color:#f3f5f7;font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
    main{padding:14px;display:grid;gap:10px}
    h1{font-size:15px;margin:0}
    p{margin:0;color:#9ba5b2}
    button{border:1px solid #3a4350;border-radius:9px;padding:10px 12px;background:#f4f5f7;color:#0c0e12;font-weight:750;cursor:pointer}
    button:disabled{opacity:.55;cursor:default}
    #status{min-height:36px;font-size:12px;color:#aeb8c4}
    .ok{color:#9fe0b5!important}.err{color:#ff9d9d!important}
  </style>
</head>
<body>
  <main>
    <h1>Aero Mix Bridge</h1>
    <p>Open your personalized YouTube Mix, then capture it once. You can close YouTube afterward.</p>
    <button id="capture" type="button">Capture current Mix</button>
    <div id="status">No background monitoring is running.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
